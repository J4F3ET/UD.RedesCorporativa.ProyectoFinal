// DNS interno de Reserva Viva (contenedor dns-interno; en el host se publica en DNS_BIND_IP:DNS_PORT de sistema/test.env).
// Solo sirve la zona interna; no hace recursión hacia Internet.
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    // Cualquier equipo de la LAN puede consultar (ya no hay VLAN 10.10.0.0/16). Es seguro porque no hay recursion
    // y solo se sirve la zona interna.
    allow-query { any; };
    allow-transfer { none; };
    recursion no;
    dnssec-validation no;
};

zone "reservaviva.local" IN {
    type primary;
    file "/etc/bind/zones/db.reservaviva.local";
    allow-update { none; };
};
