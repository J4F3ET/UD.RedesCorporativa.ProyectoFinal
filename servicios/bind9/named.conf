// DNS interno de Reserva Viva (contenedor dns-interno). Autoritativo de reservaviva.lan, sin recursion hacia Internet.
// En el host se publica en HOST_IP:DNS_PORT (sistema/test.env; 53 o 1053 segun lo decida el lanzador).
// Delega el subdominio ad.reservaviva.lan al Samba AD DC (samba-ad) y, por eso, tiene "recursion yes" solo para los
// contenedores del sistema, con una zona "." de reenvio vacia que le impide resolver nada mas (cualquier nombre fuera de
// reservaviva.lan/ad.reservaviva.lan da SERVFAIL por politica, no solo por falta de salida a Internet).
//
// Una sola vista y una sola zona: todos los nombres de servicio llevan a la IP del equipo (HOST_IP), pregunte quien pregunte.
//
// La acl red-interna la GENERA levantar-sistema.sh (generar_zona) en zones/acl-interna.conf: la subred de la red del sistema
// (NET_INTERNA) menos su gateway .1. El gateway se excluye a proposito: una consulta del anfitrion al puerto publicado llega a
// bind9 con el gateway del bridge como origen (docker-proxy / NAT de Docker), y ese cliente es el anfitrion, no un
// contenedor: no debe tener recursion.
include "/etc/bind/zones/acl-interna.conf";

options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    // Cualquiera puede consultar la zona propia: el control de quien llega lo dan el puerto publicado y la IP en la que se
    // publica (HOST_IP). Sin recursion para nadie salvo los contenedores (ver la vista).
    allow-query { any; };
    allow-transfer { none; };
    recursion no;
    // Ya en "no" (no "auto") desde antes de la delegacion a Samba AD: evita que seguir la delegacion bajo el TLD
    // .lan (sin firmar) de SERVFAIL por DNSSEC.
    dnssec-validation no;
};

view "reservaviva" {
    match-clients { any; };
    // DESVIACION DEL PLAN: el plan preveia una zona "type forward" hacia Samba AD (samba-ad, 10.10.99.10) para
    // ad.reservaviva.lan. No funciona: ad.reservaviva.lan cuelga de reservaviva.lan, de la que esta vista es
    // AUTORITATIVA (zone "reservaviva.lan" mas abajo, "type primary"). Una zona autoritativa responde ELLA MISMA
    // para cualquier nombre bajo su propio arbol (confirmado: NXDOMAIN con flag aa=1, SOA de reservaviva.lan); la
    // zona "type forward" para ese subdominio simplemente no se llega a consultar nunca, delegacion o no.
    // La solucion es la delegacion NS+glue estandar de DNS, DENTRO de la zona reservaviva.lan (ver
    // zones/db.reservaviva.lan.tpl: "ad IN NS dc1.ad.reservaviva.lan." y el glue "dc1.ad IN A ..."). Con esa
    // delegacion, y con recursion habilitada aqui, bind9 sigue la delegacion y reenvia al DC en vez de responder el
    // mismo. La recursion se habilita SOLO para los contenedores (red-interna): el resto de clientes (el anfitrion y la
    // LAN) no la tiene, y las options globales siguen en "recursion no" (si estuviera en las options globales, este DNS
    // dejaria de ser un resolutor cerrado a su propia zona).
    recursion yes;
    allow-recursion { red-interna; };
    // Sin esta zona ".", "recursion yes" dejaria a este DNS resolver CUALQUIER nombre de Internet para
    // red-interna (google.com, etc.) SI la red del sistema llegara a tener salida algun dia: hoy el aislamiento de
    // "recursion yes" es accidental (depende de que esa red no tenga salida a Internet, no de una politica de
    // bind9), y cambiar esa topologia por otro motivo lo romperia sin que nadie lo decidiera a proposito. Una
    // zona "." de reenvio SIN reenviadores hace exactamente lo que dice: cualquier nombre que no sea de nuestro
    // propio arbol (reservaviva.lan y su delegacion a ad.reservaviva.lan, que se resuelven con el NS+glue LOCAL
    // de la zona de abajo, sin pasar nunca por esta zona ".") da SERVFAIL siempre, tenga o no salida la red.
    zone "." IN {
        type forward;
        forward only;
        forwarders { };
    };
    zone "reservaviva.lan" IN {
        type primary;
        file "/etc/bind/zones/db.reservaviva.lan";
        allow-update { none; };
    };
};
