// DNS interno de Reserva Viva (VLAN 99, 10.10.99.11).
// Solo sirve la zona interna; no hace recursión hacia Internet.
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { 10.10.0.0/16; 127.0.0.1; };
    allow-transfer { none; };
    recursion no;
    dnssec-validation no;
};

zone "reservaviva.local" IN {
    type primary;
    file "/etc/bind/zones/db.reservaviva.local";
    allow-update { none; };
};
